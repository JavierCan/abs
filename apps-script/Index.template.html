<!doctype html>
<html lang="es-MX">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="abs<3">
  <link rel="manifest" href="<?= manifestUrl ?>">
  <link rel="apple-touch-icon" sizes="180x180" href="<?= touchIconUrl ?>">
  <link rel="icon" type="image/png" sizes="192x192" href="<?= icon192Url ?>">
  <link rel="icon" type="image/png" sizes="512x512" href="<?= icon512Url ?>">
  <title>abs&lt;3</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --ink: #f4f0ff;
      --violet: #9286ff;
      --rose: #ff76a2;
      --line: rgba(151, 135, 255, .17);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--black);
    }

    body {
      position: fixed;
      inset: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100%;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(39, 26, 74, .13), transparent 36%),
        #000;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-repeat: repeat;
    }

    .stars {
      z-index: -1;
      opacity: .42;
      background-image:
        radial-gradient(circle, rgba(194, 185, 255, .82) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255, 188, 219, .72) 0 .75px, transparent 1.2px);
      background-position: 17px 29px, 83px 127px;
      background-size: 137px 173px, 211px 233px;
      mask-image: linear-gradient(to bottom, transparent 2%, #000 20%, #000 78%, transparent 98%);
    }

    .stars::before {
      opacity: .55;
      background-image: radial-gradient(circle, rgba(126, 109, 255, .78) 0 .8px, transparent 1.3px);
      background-position: 61px 91px;
      background-size: 263px 197px;
    }

    .bouquet-stage {
      position: absolute;
      inset: max(.35rem, env(safe-area-inset-top)) 0 max(.2rem, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      transition: transform .55s cubic-bezier(.22, 1, .36, 1), opacity .45s ease;
    }

    .bouquet {
      display: block;
      width: min(112vw, 42rem);
      height: min(97svh, 58rem);
      overflow: visible;
      filter: drop-shadow(0 24px 34px rgba(0, 0, 0, .72));
      touch-action: manipulation;
    }

    .bouquet .bouquet-piece {
      cursor: pointer;
      outline: none;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity .35s ease, filter .35s ease;
    }

    .bouquet.has-selection .bouquet-piece:not(.is-selected) {
      opacity: .12 !important;
      filter: saturate(.45);
    }

    .bouquet.has-selection .bouquet-piece.is-selected {
      opacity: 1 !important;
      filter: drop-shadow(0 0 11px rgba(163, 143, 255, .5));
    }

    .app.panel-open .bouquet-stage {
      transform: translateY(-6svh) scale(.92);
    }

    .permission-bud {
      position: absolute;
      z-index: 4;
      top: max(10svh, calc(env(safe-area-inset-top) + 3.2rem));
      right: clamp(1.5rem, 13vw, 5.5rem);
      width: 4.6rem;
      height: 4.6rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: transparent;
      background: radial-gradient(circle, rgba(66, 30, 49, .76) 0 34%, rgba(43, 23, 38, .44) 35% 63%, transparent 64%);
      opacity: 0;
      transform: scale(.54);
      pointer-events: none;
      transition: opacity .6s ease, transform .7s cubic-bezier(.16, 1, .3, 1);
    }

    .permission-bud::before,
    .permission-bud::after {
      position: absolute;
      top: 1.2rem;
      left: 50%;
      width: .78rem;
      height: 2.1rem;
      content: "";
      border-radius: 85% 15% 70% 30%;
      transform-origin: 50% 100%;
      background: linear-gradient(180deg, #ff99b9 0%, #e64f80 54%, #8b234a 100%);
      box-shadow: 0 0 16px rgba(255, 85, 140, .42);
    }

    .permission-bud::before { transform: translateX(-50%) rotate(-13deg); }
    .permission-bud::after { transform: translateX(-50%) rotate(13deg) scaleX(-1); }

    .permission-bud span {
      position: absolute;
      top: 3.05rem;
      left: 50%;
      width: .18rem;
      height: 1.3rem;
      border-radius: 999px;
      transform: translateX(-50%);
      background: #235b43;
    }

    .permission-bud.is-visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      animation: bud-breathe 4.6s ease-in-out infinite;
    }

    .permission-bud.is-leaving {
      opacity: 0;
      transform: translate(-18vw, 24svh) scale(.34);
      pointer-events: none;
    }

    .permission-bud:focus-visible { outline: 1px solid rgba(255, 152, 194, .72); }

    .equation-panel {
      position: absolute;
      z-index: 6;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 27svh;
      padding: 1.15rem max(1.4rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1.4rem, env(safe-area-inset-left));
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(0, 0, 0, .72), #000 20%);
      opacity: 0;
      transform: translateY(102%);
      pointer-events: none;
      transition: opacity .4s ease, transform .55s cubic-bezier(.22, 1, .36, 1);
    }

    .equation-panel.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .equation {
      width: min(100%, 24rem);
      margin: 0 auto;
      color: #f4efff;
      font-size: clamp(.72rem, 3.2vw, .9rem);
      line-height: 1.8;
      letter-spacing: .015em;
      white-space: pre-line;
    }

    .equation .meta { color: var(--violet); }
    .equation .species { color: var(--rose); }

    .splash {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .splash.is-hidden { opacity: 0; }

    .splash-mark {
      position: relative;
      width: 5.2rem;
      height: 5.2rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66, 41, 116, .32), rgba(15, 10, 30, .74) 58%, transparent 60%);
      animation: splash-bloom .72s cubic-bezier(.16, 1, .3, 1) both;
    }

    .splash-mark i {
      position: absolute;
      top: 50%;
      left: 50%;
      width: .52rem;
      height: 1.72rem;
      border-radius: 50% 50% 40% 40%;
      transform-origin: 50% 100%;
      background: linear-gradient(#ff90b6, #cb285f);
      box-shadow: 0 0 10px rgba(255, 83, 139, .32);
    }

    .splash-mark i:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .splash-mark i:nth-child(2) { transform: translate(-50%, -100%) rotate(60deg); }
    .splash-mark i:nth-child(3) { transform: translate(-50%, -100%) rotate(120deg); }
    .splash-mark i:nth-child(4) { transform: translate(-50%, -100%) rotate(180deg); }
    .splash-mark i:nth-child(5) { transform: translate(-50%, -100%) rotate(240deg); }
    .splash-mark i:nth-child(6) { transform: translate(-50%, -100%) rotate(300deg); }

    .splash-mark::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1rem;
      height: 1rem;
      content: "";
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #642345;
      box-shadow: 0 0 0 .2rem rgba(255, 96, 153, .08);
    }

    .vigil-glow {
      position: absolute;
      z-index: 3;
      top: 10svh;
      left: 50%;
      width: min(54vw, 13rem);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateX(-50%) scale(.7);
      background: radial-gradient(circle, rgba(118, 54, 82, .4), rgba(60, 31, 68, .17) 46%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease, transform 1.2s cubic-bezier(.16, 1, .3, 1);
    }

    .app.is-vigil .vigil-glow {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      animation: vigil 3.6s ease-in-out infinite;
    }

    @keyframes splash-bloom {
      from { opacity: 0; transform: scale(.42) rotate(-18deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes bud-breathe {
      0%, 100% { filter: brightness(.92); }
      50% { filter: brightness(1.14); }
    }

    @keyframes vigil {
      0%, 100% { filter: brightness(.8); }
      50% { filter: brightness(1.22); }
    }

    @media (max-height: 600px) {
      .bouquet { height: 78svh; width: min(88vw, 28rem); }
      .equation-panel { min-height: 31svh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app">
    <div class="stars" aria-hidden="true"></div>
    <div class="vigil-glow" aria-hidden="true"></div>

    <div class="bouquet-stage" id="bouquetStage">
      <svg id="bouquet" class="bouquet" role="img" aria-label="Ramo vivo"></svg>
    </div>

    <button id="permissionBud" class="permission-bud" type="button" aria-label="Activar el aviso de la próxima flor" hidden>
      <span aria-hidden="true"></span>
    </button>

    <aside id="equationPanel" class="equation-panel" aria-hidden="true">
      <div id="equation" class="equation"></div>
    </aside>

    <div id="splash" class="splash" aria-hidden="true">
      <span class="splash-mark">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
    </div>
  </main>

  <script>
/*__ABS3_GARDEN__*/

    (() => {
      'use strict';

      const CACHE_KEY = 'abs3.apps-script.official-state.v2';
      const PERMISSION_KEY = 'abs3.notification-bud-seen.v1';
      const SEED = 'a3f1c07d';
      const app = document.getElementById('app');
      const bouquetSvg = document.getElementById('bouquet');
      const panel = document.getElementById('equationPanel');
      const equation = document.getElementById('equation');
      const permissionBud = document.getElementById('permissionBud');
      const splash = document.getElementById('splash');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let controller = null;
      let officialState = null;
      let vigilTimer = null;
      let unlockTimer = null;

      const safeInteger = (value) => Number.isInteger(Number(value)) && Number(value) >= 0;

      function validateState(value) {
        if (!value || value.ok !== true || value.timeZone !== 'America/Merida') throw new Error('state');
        if (!safeInteger(value.unlockedMonths) || !String(value.seed || '')) throw new Error('state');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value.officialDate || ''))) throw new Error('state');
        return value;
      }

      function loadCachedState() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          return raw ? validateState(JSON.parse(raw)) : null;
        } catch (_) {
          return null;
        }
      }

      function saveCachedState(state) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      function requestOfficialState(lastSeenMonths) {
        return new Promise((resolve, reject) => {
          if (!window.google || !google.script || !google.script.run) {
            reject(new Error('apps-script-unavailable'));
            return;
          }
          google.script.run
            .withSuccessHandler((value) => {
              try { resolve(validateState(value)); } catch (error) { reject(error); }
            })
            .withFailureHandler(reject)
            .getClientState(Number(lastSeenMonths) || 0);
        });
      }

      function localPreviewState() {
        const localHost = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
        if (!localHost) return null;
        const months = Math.max(1, Math.min(24, Number(new URLSearchParams(location.search).get('preview')) || 6));
        return {
          ok: true,
          timeZone: 'America/Merida',
          officialDate: '2026-09-15',
          officialTimestamp: '2026-09-15T00:00:02-0600',
          nextUnlockDate: '2026-10-15',
          seed: SEED,
          unlockedMonths: months,
          newMonths: []
        };
      }

      function closeEquation() {
        panel.classList.remove('is-visible');
        panel.setAttribute('aria-hidden', 'true');
        app.classList.remove('panel-open');
        controller?.clearFocus();
      }

      function equationMarkup(piece) {
        const species = String(piece.species || '').replace('tulipan', 'tulipán');
        const rho = Number(piece.pos.rho || 0).toFixed(2);
        const theta = ((Number(piece.pos.theta || 0) * 180 / Math.PI) % 360 + 360) % 360;
        return [
          `<span class="meta">m = ${piece.m}</span> · <span class="species">${species}</span>`,
          `ρₘ = 44√${piece.m} = ${rho}`,
          `θₘ = ${piece.m}ψ = ${theta.toFixed(4)}°`,
          `ψ = 137.507764°`,
          `τ = 1.00`
        ].join('\n');
      }

      function openEquation(month) {
        const piece = controller?.getPiece(month);
        if (!piece) return;
        controller.focusMonth(month);
        equation.innerHTML = equationMarkup(piece);
        panel.classList.add('is-visible');
        panel.setAttribute('aria-hidden', 'false');
        app.classList.add('panel-open');
      }

      function bindInteractions() {
        bouquetSvg.addEventListener('click', (event) => {
          const group = event.target.closest('.bouquet-piece');
          if (!group) {
            closeEquation();
            return;
          }
          openEquation(Number(group.dataset.month));
        });

        document.getElementById('bouquetStage').addEventListener('click', (event) => {
          if (!event.target.closest('.bouquet-piece')) closeEquation();
        });

        panel.addEventListener('click', closeEquation);

        permissionBud.addEventListener('click', async () => {
          permissionBud.classList.remove('is-visible');
          permissionBud.classList.add('is-leaving');
          try { localStorage.setItem(PERMISSION_KEY, '1'); } catch (_) {}
          if ('Notification' in window && Notification.permission === 'default') {
            try { await Notification.requestPermission(); } catch (_) {}
          }
          setTimeout(() => {
            permissionBud.hidden = true;
            permissionBud.classList.remove('is-leaving');
          }, 760);
        });
      }

      function maybeShowPermissionBud() {
        let seen = false;
        try { seen = localStorage.getItem(PERMISSION_KEY) === '1'; } catch (_) {}
        const canAsk = 'Notification' in window && Notification.permission === 'default';
        if (seen || !canAsk) return;
        permissionBud.hidden = false;
        requestAnimationFrame(() => permissionBud.classList.add('is-visible'));
      }

      function clearVigilTimers() {
        if (vigilTimer) clearTimeout(vigilTimer);
        if (unlockTimer) clearTimeout(unlockTimer);
        vigilTimer = null;
        unlockTimer = null;
      }

      function scheduleVigil(state) {
        clearVigilTimers();
        app.classList.remove('is-vigil');
        if (!state.officialTimestamp || !state.nextUnlockDate) return;
        const match = String(state.officialTimestamp).match(/([+-]\d{2})(\d{2})$/);
        if (!match) return;
        const offset = `${match[1]}:${match[2]}`;
        const target = Date.parse(`${state.nextUnlockDate}T00:00:00${offset}`);
        const serverNow = Date.parse(String(state.officialTimestamp).replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
        if (!Number.isFinite(target) || !Number.isFinite(serverNow)) return;
        const untilUnlock = target - serverNow;
        if (untilUnlock <= 0 || untilUnlock > 36 * 60 * 60 * 1000) return;
        const enterVigil = () => app.classList.add('is-vigil');
        if (untilUnlock <= 30000) enterVigil();
        else vigilTimer = setTimeout(enterVigil, untilUnlock - 30000);
        unlockTimer = setTimeout(() => synchronize(true), untilUnlock + 1200);
      }

      async function applyOfficialState(state, cached, fromUnlockTimer = false) {
        const previous = cached && cached.seed === state.seed ? Number(cached.unlockedMonths) : null;
        const delta = previous == null ? null : state.unlockedMonths - previous;
        officialState = state;
        closeEquation();

        if (!reducedMotion.matches && previous != null && delta > 0 && delta <= 3) {
          controller.show(previous, state.seed);
          for (let month = previous + 1; month <= state.unlockedMonths; month += 1) {
            await controller.playMonthlyArrival(month, state.seed);
          }
          if (fromUnlockTimer && 'Notification' in window && Notification.permission === 'granted') {
            try { new Notification('abs<3', { body: 'Algo abrió esta noche…' }); } catch (_) {}
          }
        } else if (!cached || cached.seed !== state.seed || cached.unlockedMonths !== state.unlockedMonths) {
          controller.show(state.unlockedMonths, state.seed);
          if (!reducedMotion.matches && state.unlockedMonths > 0) await controller.playAwakening();
        }

        saveCachedState(state);
        scheduleVigil(state);
        // Fase 5.3: el capullo de permiso queda desactivado; no forma parte de la vista final.
      }

      async function synchronize(fromUnlockTimer = false) {
        const cached = loadCachedState();
        if (cached && !officialState) {
          officialState = cached;
          controller.show(cached.unlockedMonths, cached.seed);
          if (!reducedMotion.matches) void controller.playAwakening();
        }
        try {
          const state = await requestOfficialState(cached?.unlockedMonths || 0);
          await applyOfficialState(state, cached, fromUnlockTimer);
        } catch (_) {
          const preview = localPreviewState();
          if (preview) await applyOfficialState(preview, null, false);
          else if (cached) scheduleVigil(cached);
        }
      }

      function start() {
        controller = createBouquetScene(bouquetSvg, {
          months: 0,
          seed: SEED,
          spacing: 44,
          kappa: .82,
          reducedMotion: reducedMotion.matches
        });
        bindInteractions();
        reducedMotion.addEventListener?.('change', (event) => controller.setReducedMotion(event.matches));
        setTimeout(() => {
          splash.classList.add('is-hidden');
          setTimeout(() => splash.remove(), 260);
        }, reducedMotion.matches ? 40 : 720);
        void synchronize(false);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && controller) void synchronize(false);
      });

      window.addEventListener('beforeunload', () => {
        clearVigilTimers();
        controller?.destroy();
      });

      start();
    })();
  </script>
</body>
</html>
