<script>
/* flowers.js */
/**
 * abs<3 — generador matemático de flores
 * Fase 1: matemática pura. Sin DOM, sin animación, sin red.
 * Todo es determinista: misma semilla + mismo mes = misma flor, siempre.
 */

/* ── Constantes ─────────────────────────────────────────────── */

const PHI = (1 + Math.sqrt(5)) / 2;
const PSI = 2 * Math.PI * (1 - 1 / PHI);   // ángulo áureo, radianes
const PSI_DEG = (PSI * 180) / Math.PI;     // 137.50776...
const SPECIES = ['hortensia', 'tulipan', 'gerbera', 'lirio'];

/* ── Azar reproducible ──────────────────────────────────────── */

function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rngFor(seed, tag) {
  return mulberry32(fnv1a(seed + ':' + tag));
}

/* ── Bolsa de especies por ciclos de cuatro ─────────────────── */

function speciesForMonth(seed, m) {
  const cycle = Math.floor((m - 1) / 4);
  const rnd = rngFor(seed, 'cycle' + cycle);
  const bag = SPECIES.slice();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = bag[i];
    bag[i] = bag[j];
    bag[j] = tmp;
  }
  return bag[(m - 1) % 4];
}

/* ── Filotaxis de Vogel: dónde se coloca la pieza del mes m ──── */

const PLANE_SCALE = [0.80, 0.90, 1.00];

function placement(m, opts = {}) {
  const c = opts.c ?? 26;          // separación radial; NO depende del total
  const kappa = opts.kappa ?? 0.72; // compresión vertical del ramo
  const theta = m * PSI;
  const rho = c * Math.sqrt(m);
  const plane = m % 3;
  return {
    theta,
    rho,
    x: rho * Math.cos(theta),
    y: -kappa * rho * Math.sin(theta),
    scale: (opts.s0 ?? 1) * PLANE_SCALE[plane],
    plane
  };
}

/* ── Superfórmula de Gielis ─────────────────────────────────── */

function superformula(t, p) {
  const a = p.a ?? 1;
  const b = p.b ?? 1;
  const t1 = Math.pow(Math.abs(Math.cos((p.p * t) / 4) / a), p.n2);
  const t2 = Math.pow(Math.abs(Math.sin((p.p * t) / 4) / b), p.n3);
  const s = t1 + t2;
  return s === 0 ? 0 : Math.pow(s, -1 / p.n1);
}

function superPath(p, radius, steps = 200) {
  let max = 0;
  const raw = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * 2 * Math.PI;
    const r = superformula(t, p);
    raw.push([t, isFinite(r) ? r : 0]);
    if (isFinite(r) && r > max) max = r;
  }
  if (max === 0) return '';
  let d = '';
  for (let i = 0; i < raw.length; i++) {
    const r = (raw[i][1] / max) * radius;
    const x = r * Math.cos(raw[i][0]);
    const y = r * Math.sin(raw[i][0]);
    d += (i === 0 ? 'M ' : ' L ') + n(x) + ' ' + n(y);
  }
  return d + ' Z';
}

/* ── Utilidades de trazo ────────────────────────────────────── */

const n = (v) => (Math.round(v * 100) / 100).toString();

function closedPath(right, left) {
  let d = 'M ' + n(right[0][0]) + ' ' + n(right[0][1]);
  for (let i = 1; i < right.length; i++) d += ' L ' + n(right[i][0]) + ' ' + n(right[i][1]);
  for (let i = left.length - 1; i >= 0; i--) d += ' L ' + n(left[i][0]) + ' ' + n(left[i][1]);
  return d + ' Z';
}

/** Perfil de pétalo: x(u) = w·sin(π·u^e), y(u) = −L·u */
function petalPath(L, w, e = 0.8, steps = 16) {
  const right = [], left = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const x = w * Math.sin(Math.PI * Math.pow(u, e));
    const y = -L * u;
    right.push([x, y]);
    left.push([-x, y]);
  }
  return closedPath(right, left);
}

/** Tépalo recurvado: x(u) = w·sin(πu)(1−βu), y(u) = −L·u + c·u³ */
function recurvedPath(L, w, beta, c, steps = 18) {
  const right = [], left = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const x = w * Math.sin(Math.PI * u) * (1 - beta * u);
    const y = -L * u + c * L * Math.pow(u, 3);
    right.push([x, y]);
    left.push([-x, y]);
  }
  return closedPath(right, left);
}

/** Rosa de 4 pétalos: r(θ) = a·|cos(2θ)| */
function rosePath(a, steps = 72) {
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * 2 * Math.PI;
    const r = a * Math.abs(Math.cos(2 * t));
    d += (i === 0 ? 'M ' : ' L ') + n(r * Math.cos(t)) + ' ' + n(r * Math.sin(t));
  }
  return d + ' Z';
}

/** Bézier cúbica con apertura: rota P1 y P2 sobre P0 un ángulo α */
function bezierTepal(L, w, alphaDeg) {
  const a = (alphaDeg * Math.PI) / 180;
  const rot = (px, py) => [
    px * Math.cos(a) - py * Math.sin(a),
    px * Math.sin(a) + py * Math.cos(a)
  ];
  const p1 = rot(-w, -0.35 * L);
  const p2 = rot(-w * 0.85, -0.85 * L);
  const q1 = rot(w * 0.85, -0.85 * L);
  const q2 = rot(w, -0.35 * L);
  return (
    'M 0 0 C ' + n(p1[0]) + ' ' + n(p1[1]) + ' ' + n(p2[0]) + ' ' + n(p2[1]) +
    ' 0 ' + n(-L) + ' C ' + n(q1[0]) + ' ' + n(q1[1]) + ' ' + n(q2[0]) + ' ' + n(q2[1]) + ' 0 0 Z'
  );
}

/* ── Parámetros por especie ─────────────────────────────────── */

const pick = (rnd, lo, hi) => lo + rnd() * (hi - lo);

function paramsFor(species, rnd) {
  switch (species) {
    case 'gerbera':
      return {
        n: Math.round(pick(rnd, 26, 32)),
        L: pick(rnd, 42, 50),
        w: pick(rnd, 5.2, 6.4),
        p: Math.round(pick(rnd, 22, 30)),
        n1: pick(rnd, 0.62, 0.78),
        n2: pick(rnd, 2.1, 2.7),
        n3: pick(rnd, 2.1, 2.7),
        discN: Math.round(pick(rnd, 76, 96)),
        discR: pick(rnd, 9.5, 12),
        hue: Math.round(pick(rnd, 340, 352))
      };
    case 'hortensia':
      return {
        N: Math.round(pick(rnd, 118, 148)),
        R: pick(rnd, 33, 40),
        a: pick(rnd, 4.9, 5.7),
        hue: Math.round(pick(rnd, 254, 268))
      };
    case 'tulipan':
      return {
        L: pick(rnd, 52, 60),
        w: pick(rnd, 15.5, 18.5),
        a0: 4,
        a1: pick(rnd, 32, 40),
        hue: Math.round(pick(rnd, 348, 358))
      };
    case 'lirio':
      return {
        L: pick(rnd, 50, 58),
        w: pick(rnd, 9, 11.5),
        beta: pick(rnd, 0.46, 0.58),
        c: pick(rnd, 0.30, 0.42),
        p: 6,
        n1: pick(rnd, 0.78, 0.92),
        n2: 1.7, n3: 1.7,
        hue: Math.round(pick(rnd, 304, 320))
      };
  }
}

/* ── Constructores ──────────────────────────────────────────── */

function gerbera(p, tau, lod) {
  const parts = [];
  const L = p.L * tau;
  const hue = p.hue;
  const petals = Math.max(9, Math.round(p.n * lod));
  const discCount = Math.max(10, Math.round(p.discN * lod));

  parts.push({ t: 'path', d: superPath(p, p.L * 1.15), fill: `hsl(${hue} 90% 62% / 0.07)` });
  parts.push({ t: 'circle', r: p.L * 0.75, fill: `hsl(${hue} 90% 62% / 0.10)` });

  for (let j = 0; j < petals; j++) {
    const alpha = (360 * j) / petals;
    parts.push({
      t: 'path',
      d: petalPath(L, p.w, 0.8),
      fill: `hsl(${hue} ${72 + (j % 3) * 4}% ${46 + (j % 2) * 6}%)`,
      rot: alpha * tau
    });
  }
  const inner = Math.max(6, Math.round(petals * 0.7));
  for (let j = 0; j < inner; j++) {
    const alpha = (360 * j) / inner + 180 / inner;
    parts.push({
      t: 'path',
      d: petalPath(L * 0.58, p.w * 0.82, 0.8),
      fill: `hsl(${hue} 88% ${64 + (j % 2) * 6}%)`,
      rot: alpha * tau
    });
  }

  const discR = p.discR * tau;
  parts.push({ t: 'circle', r: discR, fill: `hsl(24 72% 22%)` });
  const c = discR / Math.sqrt(discCount);
  for (let i = 1; i <= discCount; i++) {
    const r = c * Math.sqrt(i);
    const t = i * PSI;
    parts.push({
      t: 'circle',
      cx: r * Math.cos(t),
      cy: r * Math.sin(t),
      r: 0.75,
      fill: i > discCount * 0.55 ? 'hsl(38 92% 64%)' : 'hsl(30 80% 46%)'
    });
  }
  return parts;
}

function hortensia(p, tau, lod) {
  const parts = [];
  const R = p.R * tau;
  const count = Math.max(14, Math.round(p.N * lod));
  parts.push({ t: 'circle', r: R * 1.7, fill: `hsl(${p.hue} 88% 66% / 0.09)` });
  const c = R / Math.sqrt(count);
  for (let i = 1; i <= count; i++) {
    const rho = c * Math.sqrt(i);
    const t = i * PSI;
    const s = (0.3 + 0.7 * tau) * (1 - 0.35 * Math.pow(rho / R, 2));
    const light = 62 - 14 * (rho / R);
    parts.push({
      t: 'path',
      d: rosePath(p.a),
      fill: `hsl(${p.hue + (i % 5) * 2} 76% ${light.toFixed(1)}%)`,
      tx: rho * Math.cos(t),
      ty: rho * Math.sin(t),
      sc: s,
      rot: (t * 180) / Math.PI
    });
    if (lod > 0.5) {
      parts.push({
        t: 'circle',
        cx: rho * Math.cos(t),
        cy: rho * Math.sin(t),
        r: 0.9 * s,
        fill: 'hsl(258 100% 95%)'
      });
    }
  }
  return parts;
}

function tulipan(p, tau) {
  const parts = [];
  const alpha = p.a0 + tau * (p.a1 - p.a0);
  parts.push({ t: 'circle', cy: -p.L * 0.45, r: p.L * 0.78, fill: `hsl(${p.hue} 90% 60% / 0.08)` });
  for (let j = 0; j < 3; j++) {
    parts.push({
      t: 'path',
      d: bezierTepal(p.L * 0.94, p.w * 1.06, alpha * 1.25),
      fill: `hsl(${p.hue} 72% 28%)`,
      rot: 60 * j + 30
    });
  }
  for (let j = 0; j < 3; j++) {
    parts.push({
      t: 'path',
      d: bezierTepal(p.L, p.w, alpha),
      fill: `hsl(${p.hue} 80% ${44 + j * 3}%)`,
      rot: 60 * j
    });
  }
  parts.push({
    t: 'path',
    d: bezierTepal(p.L * 0.7, p.w * 0.5, alpha * 0.6),
    fill: `hsl(${p.hue} 92% 72% / 0.42)`
  });
  return parts;
}

function lirio(p, tau) {
  const parts = [];
  const L = p.L * (0.35 + 0.65 * tau);
  const spread = 0.35 + 0.65 * tau;
  parts.push({ t: 'path', d: superPath(p, p.L * 1.1), fill: `hsl(${p.hue} 80% 80% / 0.07)` });
  for (let j = 0; j < 3; j++) {
    parts.push({
      t: 'path',
      d: recurvedPath(L * 0.96, p.w, p.beta, p.c * tau),
      fill: `hsl(${p.hue} 46% 68%)`,
      rot: (60 * j + 30) * spread
    });
  }
  for (let j = 0; j < 3; j++) {
    parts.push({
      t: 'path',
      d: recurvedPath(L, p.w * 1.05, p.beta, p.c * tau),
      fill: `hsl(${p.hue} 70% ${86 - j * 2}%)`,
      rot: 60 * j * spread
    });
  }
  for (let j = 0; j < 6; j++) {
    const a = ((60 * j + 20) * Math.PI) / 180;
    const len = L * 0.4;
    parts.push({
      t: 'path',
      d: `M 0 0 L ${n(Math.sin(a) * len * 0.4)} ${n(-Math.cos(a) * len)}`,
      stroke: 'hsl(42 70% 72%)',
      sw: 0.9
    });
    parts.push({
      t: 'circle',
      cx: Math.sin(a) * len * 0.45,
      cy: -Math.cos(a) * len * 1.06,
      r: 1.5,
      fill: 'hsl(34 74% 50%)'
    });
  }
  parts.push({ t: 'circle', r: 2.2, fill: 'hsl(44 76% 80%)' });
  return parts;
}

/* ── API pública ────────────────────────────────────────────── */

/**
 * lod ∈ (0,1] — nivel de detalle. 1 = plano frontal, valores menores
 * reducen pétalos y flósculos en los planos de fondo, donde no se nota.
 */
function buildFlower(species, params, tau = 1, lod = 1) {
  const t = Math.max(0.001, Math.min(1, tau));
  const d = Math.max(0.08, Math.min(1, lod));
  if (species === 'gerbera') return gerbera(params, t, d);
  if (species === 'hortensia') return hortensia(params, t, d);
  if (species === 'tulipan') return tulipan(params, t);
  return lirio(params, t);
}

const PLANE_LOD = [0.30, 0.60, 1.00];

function formulaFor(species, p, tau = 1) {
  const r = (v, d = 2) => Number(v).toFixed(d);
  switch (species) {
    case 'gerbera':
      return [
        'r(θ) = ( |cos(pθ/4)/a|^n₂ + |sin(pθ/4)/b|^n₃ )^(−1/n₁)',
        `p = ${p.p},  n₁ = ${p.n1},  n₂ = n₃ = ${p.n2}`,
        'x(u) = w·sin(π·u^0.8),   y(u) = −L·u',
        `n = ${p.n},  L = ${r(p.L, 1)},  w = ${r(p.w)}`,
        `disco:  ρᵢ = c√i,  θᵢ = i·ψ,  ψ = ${r(PSI_DEG, 5)}°`,
        `τ = ${r(tau)}`
      ];
    case 'hortensia':
      return [
        'corimbo:  ρᵢ = c√i,   θᵢ = i·ψ',
        `ψ = ${r(PSI_DEG, 5)}°,  N = ${p.N},  R = ${r(p.R, 1)}`,
        'flósculo:  r(θ) = a·cos(2θ)',
        `a = ${r(p.a)}`,
        'sᵢ = s₀(1 − 0.35·(ρᵢ/R)²)',
        `τ = ${r(tau)}`
      ];
    case 'tulipan':
      return [
        'B(t) = (1−t)³P₀ + 3(1−t)²t·P₁ + 3(1−t)t²·P₂ + t³P₃',
        'α(τ) = α₀ + τ(α₁ − α₀)',
        `α₀ = ${p.a0}°,  α₁ = ${r(p.a1, 1)}°,  α = ${r(p.a0 + tau * (p.a1 - p.a0), 1)}°`,
        `L = ${r(p.L, 1)},  w = ${r(p.w, 1)}`,
        '6 tépalos, 2 verticilos desfasados 60°',
        `τ = ${r(tau)}`
      ];
    default:
      return [
        'x(u) = w·sin(πu)·(1 − βu)',
        'y(u) = −L·u + c·u³',
        `β = ${r(p.beta)},  c = ${r(p.c)}·L,  u ∈ [0,1]`,
        `L = ${r(p.L, 1)},  w = ${r(p.w, 1)}`,
        `envolvente: p = ${p.p}, n₁ = ${p.n1}, n₂ = n₃ = ${p.n2}`,
        `τ = ${r(tau)}`
      ];
  }
}

/** Composición completa del ramo hasta el mes `months`. */
function buildBouquet(seed, months, opts = {}) {
  const c = opts.c ?? 44;
  const kappa = opts.kappa ?? 0.82;
  const pieces = [];
  for (let m = 1; m <= months; m++) {
    const species = speciesForMonth(seed, m);
    const rnd = rngFor(seed, 'm' + m);
    const params = paramsFor(species, rnd);
    const pos = placement(m, { c, kappa });
    pieces.push({
      m,
      species,
      params,
      pos,
      lod: PLANE_LOD[pos.plane],
      tilt: (rnd() - 0.5) * 18,
      phase: 2 * Math.PI * ((m * PHI) % 1),
      period: 6 + rnd() * 3
    });
  }
  pieces.sort((a, b) => a.pos.plane - b.pos.plane || b.pos.rho - a.pos.rho);
  return pieces;
}

/** Encuadre que contiene todo el ramo. La cámara se abre; las flores no se mueven. */
function bouquetBounds(pieces, opts = {}) {
  const pad = opts.pad ?? 70;
  let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
  for (const pc of pieces) {
    const r = (pc.params.L || pc.params.R || 40) * pc.pos.scale * 1.2;
    x0 = Math.min(x0, pc.pos.x - r); x1 = Math.max(x1, pc.pos.x + r);
    y0 = Math.min(y0, pc.pos.y - r); y1 = Math.max(y1, pc.pos.y + r);
  }
  const crownW = Math.max(1, x1 - x0);
  const crownH = Math.max(1, y1 - y0);
  const stem = (opts.stem ?? 0.58) * Math.max(130, crownH);
  const baseY = y1 + stem;
  return {
    x: x0 - pad,
    y: y0 - pad,
    w: (x1 - x0) + pad * 2,
    h: crownH + stem + pad * 1.35,
    baseY,
    tieY: y1 + stem * 0.46,
    crown: { x0, x1, y0, y1, w: crownW, h: crownH }
  };
}

/* foliage.js */
/**
 * abs<3 — follaje y envoltura
 * Todo se deriva de la misma semilla que las flores, así que el follaje
 * tampoco cambia nunca al recargar.
 */

const fmt = (v) => (Math.round(v * 100) / 100).toString();

/* ── Tallo: Bézier cuadrática de la base a la flor ──────────── */

function stemFor(pc, baseY) {
  const p0 = [0, baseY];
  const p1 = [pc.pos.x * 0.42, (baseY + pc.pos.y) * 0.55];
  const p2 = [pc.pos.x, pc.pos.y];
  const at = (t) => {
    const u = 1 - t;
    return [
      u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
      u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]
    ];
  };
  const tangent = (t) => {
    const dx = 2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    const dy = 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    return (Math.atan2(dy, dx) * 180) / Math.PI + 90;
  };
  return {
    d: `M ${fmt(p0[0])} ${fmt(p0[1])} Q ${fmt(p1[0])} ${fmt(p1[1])} ${fmt(p2[0])} ${fmt(p2[1])}`,
    at,
    tangent
  };
}

/* ── Hoja: x(u) = w·sin(π·u^0.7)·(1 − 0.12u) + κ·L·u² ──────── */

function leafPath(L, w, bend, steps = 16) {
  const right = [], left = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const half = w * Math.sin(Math.PI * Math.pow(u, 0.7)) * (1 - 0.12 * u);
    const drift = bend * L * u * u * 0.35;
    right.push([drift + half, -L * u]);
    left.push([drift - half, -L * u]);
  }
  let d = 'M ' + fmt(right[0][0]) + ' ' + fmt(right[0][1]);
  for (let i = 1; i < right.length; i++) d += ' L ' + fmt(right[i][0]) + ' ' + fmt(right[i][1]);
  for (let i = left.length - 1; i >= 0; i--) d += ' L ' + fmt(left[i][0]) + ' ' + fmt(left[i][1]);
  return d + ' Z';
}

function midribPath(L, bend) {
  return `M 0 0 Q ${fmt(bend * L * 0.14)} ${fmt(-L * 0.5)} ${fmt(bend * L * 0.35)} ${fmt(-L * 0.92)}`;
}

/* ── Brote ──────────────────────────────────────────────────── */

function budPath(L, w) {
  return `M 0 0 C ${fmt(-w)} ${fmt(-L * 0.28)} ${fmt(-w)} ${fmt(-L * 0.78)} 0 ${fmt(-L)} ` +
         `C ${fmt(w)} ${fmt(-L * 0.78)} ${fmt(w)} ${fmt(-L * 0.28)} 0 0 Z`;
}

/* ── Follaje completo del ramo ──────────────────────────────── */

const GREEN = (plane, shift = 0) =>
  `hsl(${155 + shift} ${42 + plane * 6}% ${13 + plane * 7}%)`;
const VEIN = (plane) => `hsl(158 40% ${26 + plane * 10}%)`;

function buildFoliage(seed, pieces, baseY, opts = {}) {
  const back = [], front = [];
  const density = opts.density ?? 1;
  const spacing = opts.spacing ?? 44;

  for (const pc of pieces) {
    const rnd = rngFor(seed, 'foliage' + pc.m);
    const stem = stemFor(pc, baseY);
    const bucket = pc.pos.plane === 0 ? back : front;
    const s = pc.pos.scale;

    // Hojas prendidas al tallo, alternadas a izquierda y derecha
    const leaves = 1 + Math.round(rnd() * 1.6 * density);
    for (let k = 0; k < leaves; k++) {
      const t = 0.34 + 0.3 * k + rnd() * 0.12;
      if (t > 0.86) continue;
      const [lx, ly] = stem.at(t);
      const side = k % 2 === 0 ? 1 : -1;
      const rot = stem.tangent(t) + side * (32 + rnd() * 20);
      const L = (34 + rnd() * 18) * s;
      const w = L * (0.26 + rnd() * 0.07);
      const bend = side * (0.3 + rnd() * 0.4);
      bucket.push({ t: 'path', d: leafPath(L, w, bend), fill: GREEN(pc.pos.plane, (k % 3) * 3), tx: lx, ty: ly, rot, m: pc.m, kind: 'leaf' });
      if (pc.pos.plane > 0) {
        bucket.push({ t: 'path', d: midribPath(L, bend), stroke: VEIN(pc.pos.plane), sw: 0.6, tx: lx, ty: ly, rot, m: pc.m, kind: 'leaf' });
      }
    }

    // Brote en uno de cada tres meses
    if (pc.m % 3 === 1) {
      const t = 0.72 + rnd() * 0.12;
      const [bx, by] = stem.at(t);
      const rot = stem.tangent(t) + (rnd() - 0.5) * 46;
      const L = (16 + rnd() * 9) * s;
      front.push({ t: 'path', d: budPath(L, L * 0.3), fill: `hsl(${340 + rnd() * 12} 58% 42%)`, tx: bx, ty: by, rot, m: pc.m, kind: 'leaf' });
      front.push({ t: 'path', d: budPath(L * 0.62, L * 0.16), fill: 'hsl(344 78% 66%)', o: 0.55, tx: bx, ty: by, rot, m: pc.m, kind: 'leaf' });
    }
  }

  // Ramitas de relleno en los huecos: mismo ángulo áureo, medio paso corrido
  const sprigs = Math.max(3, Math.round(pieces.length * 0.55 * density));
  for (let i = 1; i <= sprigs; i++) {
    const rnd = rngFor(seed, 'sprig' + i);
    const theta = (i + 0.5) * PSI;
    const rho = spacing * Math.sqrt(i + 0.5) * 1.08;
    const x = rho * Math.cos(theta);
    const y = -0.72 * rho * Math.sin(theta);
    const rot = (Math.atan2(y, x) * 180) / Math.PI + 90 + (rnd() - 0.5) * 30;
    const len = 46 + rnd() * 26;
    const bucket = i % 3 === 0 ? front : back;
    bucket.push({
      t: 'path',
      d: `M 0 0 Q ${fmt(len * 0.12)} ${fmt(-len * 0.55)} ${fmt(len * 0.1)} ${fmt(-len)}`,
      stroke: GREEN(1, 0), sw: 1.3, tx: x, ty: y, rot
    });
    const leaflets = 6 + Math.floor(rnd() * 3);
    for (let k = 1; k <= leaflets; k++) {
      const u = k / (leaflets + 1);
      const lx = x + Math.sin((rot * Math.PI) / 180) * 0 + 0;
      const side = k % 2 === 0 ? 1 : -1;
      bucket.push({
        t: 'path',
        d: leafPath(9 - u * 3, 3.4 - u, side * 0.4),
        fill: GREEN(i % 3 === 0 ? 2 : 0, 4),
        tx: x + (len * 0.1 * u) * Math.cos((rot * Math.PI) / 180) - side * 3,
        ty: y - len * u,
        rot: rot + side * 52
      });
      void lx;
    }
  }

  // Destellos: pétalos diminutos en el perímetro
  const sparks = Math.round(pieces.length * 1.4 * density);
  for (let i = 1; i <= sparks; i++) {
    const rnd = rngFor(seed, 'spark' + i);
    const theta = (i + 0.31) * PSI;
    const rho = spacing * Math.sqrt(i) * (1.02 + rnd() * 0.24);
    front.push({
      t: 'circle',
      cx: rho * Math.cos(theta),
      cy: -0.72 * rho * Math.sin(theta),
      r: 1 + rnd() * 1.1,
      fill: rnd() > 0.5 ? 'hsl(330 100% 92%)' : 'hsl(258 100% 90%)',
      o: 0.35 + rnd() * 0.4
    });
  }

  return { back, front };
}

/* wrapping.js */
/**
 * abs<3 — envoltura orgánica y lazo
 * Geometría ligera, proporcional a la copa y sin filtros SVG costosos.
 */

const fmtWrap = (v) => (Math.round(v * 100) / 100).toString();
const clampWrap = (x, min, max) => Math.max(min, Math.min(max, x));

const pathPart = (d, fill, o = 1) => ({ t: 'path', d, fill, o });

function buildWrapping(bounds) {
  const crown = bounds.crown;
  const anchorX = (crown.x0 + crown.x1) / 2;
  const anchorY = bounds.tieY;
  const shoulder = clampWrap(crown.w * 0.48, 92, 310);
  const rise = Math.max(58, anchorY - crown.y1 + crown.h * 0.08);
  const tail = Math.max(62, bounds.baseY - anchorY + 14);
  const foot = clampWrap(crown.w * 0.095, 24, 54);
  const bowW = clampWrap(crown.w * 0.16, 48, 92);
  const bowH = bowW * 0.44;

  const n = (v) => fmtWrap(v);

  const backLeft =
    `M 0 4 C ${n(-shoulder * 0.18)} ${n(-rise * 0.18)} ` +
    `${n(-shoulder * 0.72)} ${n(-rise * 0.88)} ${n(-shoulder)} ${n(-rise)} ` +
    `C ${n(-shoulder * 0.78)} ${n(-rise * 1.08)} ${n(-shoulder * 0.42)} ${n(-rise * 0.82)} ` +
    `${n(-shoulder * 0.22)} ${n(-rise * 0.52)} C ${n(-shoulder * 0.08)} ${n(-rise * 0.28)} -8 -4 0 4 Z`;
  const backRight =
    `M 0 4 C ${n(shoulder * 0.18)} ${n(-rise * 0.18)} ` +
    `${n(shoulder * 0.72)} ${n(-rise * 0.88)} ${n(shoulder)} ${n(-rise)} ` +
    `C ${n(shoulder * 0.78)} ${n(-rise * 1.08)} ${n(shoulder * 0.42)} ${n(-rise * 0.82)} ` +
    `${n(shoulder * 0.22)} ${n(-rise * 0.52)} C ${n(shoulder * 0.08)} ${n(-rise * 0.28)} 8 -4 0 4 Z`;

  const frontLeft =
    `M 2 0 C ${n(-shoulder * 0.2)} ${n(-rise * 0.12)} ${n(-shoulder * 0.62)} ${n(-rise * 0.62)} ` +
    `${n(-shoulder * 0.9)} ${n(-rise * 0.8)} C ${n(-shoulder * 0.76)} ${n(-rise * 0.3)} ` +
    `${n(-shoulder * 0.42)} ${n(-rise * 0.02)} ${n(-foot)} ${n(tail)} L 0 ${n(tail * 0.78)} Z`;
  const frontRight =
    `M -2 0 C ${n(shoulder * 0.2)} ${n(-rise * 0.12)} ${n(shoulder * 0.62)} ${n(-rise * 0.62)} ` +
    `${n(shoulder * 0.9)} ${n(-rise * 0.8)} C ${n(shoulder * 0.76)} ${n(-rise * 0.3)} ` +
    `${n(shoulder * 0.42)} ${n(-rise * 0.02)} ${n(foot)} ${n(tail)} L 0 ${n(tail * 0.78)} Z`;

  const leftLoop =
    `M -3 0 C ${n(-bowW * 0.24)} ${n(-bowH)} ${n(-bowW * 0.92)} ${n(-bowH * 1.04)} ` +
    `${n(-bowW)} ${n(-bowH * 0.12)} C ${n(-bowW * 0.9)} ${n(bowH * 0.72)} ` +
    `${n(-bowW * 0.3)} ${n(bowH * 0.5)} -3 0 Z`;
  const rightLoop =
    `M 3 0 C ${n(bowW * 0.24)} ${n(-bowH)} ${n(bowW * 0.92)} ${n(-bowH * 1.04)} ` +
    `${n(bowW)} ${n(-bowH * 0.12)} C ${n(bowW * 0.9)} ${n(bowH * 0.72)} ` +
    `${n(bowW * 0.3)} ${n(bowH * 0.5)} 3 0 Z`;
  const leftRibbon =
    `M -8 6 C ${n(-bowW * 0.18)} ${n(tail * 0.2)} ${n(-bowW * 0.28)} ${n(tail * 0.48)} ` +
    `${n(-bowW * 0.48)} ${n(tail * 0.72)} L ${n(-bowW * 0.2)} ${n(tail * 0.63)} ` +
    `C ${n(-bowW * 0.08)} ${n(tail * 0.38)} -3 ${n(tail * 0.16)} -1 8 Z`;
  const rightRibbon =
    `M 8 6 C ${n(bowW * 0.18)} ${n(tail * 0.2)} ${n(bowW * 0.28)} ${n(tail * 0.48)} ` +
    `${n(bowW * 0.48)} ${n(tail * 0.72)} L ${n(bowW * 0.2)} ${n(tail * 0.63)} ` +
    `C ${n(bowW * 0.08)} ${n(tail * 0.38)} 3 ${n(tail * 0.16)} 1 8 Z`;

  return {
    anchorX,
    anchorY,
    back: [
      pathPart(backLeft, 'hsl(330 34% 19%)', 0.72),
      pathPart(backRight, 'hsl(276 30% 20%)', 0.72)
    ],
    front: [
      pathPart(frontLeft, 'hsl(338 42% 27%)', 0.84),
      pathPart(frontRight, 'hsl(288 34% 26%)', 0.84)
    ],
    bow: [
      pathPart(leftRibbon, 'hsl(340 60% 37%)', 0.94),
      pathPart(rightRibbon, 'hsl(329 66% 43%)', 0.94),
      pathPart(leftLoop, 'hsl(340 65% 45%)', 1),
      pathPart(rightLoop, 'hsl(329 70% 50%)', 1),
      { t: 'circle', cx: 0, cy: 0, r: bowH * 0.38, fill: 'hsl(344 68% 38%)', o: 1 }
    ],
    glow: [
      { t: 'circle', cx: 0, cy: 0, r: bowW * 1.08, fill: 'none', stroke: 'hsl(48 100% 88%)', sw: 1.5, o: 1 }
    ]
  };
}

/* motion.js */
/**
 * abs<3 — movimiento
 * Un solo parámetro τ manda sobre todo: tallo, hojas y apertura de pétalos.
 * τ = 0 → capullo cerrado, tallo sin dibujar.
 * τ = 1 → estado actual de la flor.
 */

const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) =>
  x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

/**
 * Despertar: todas las piezas crecen en orden cronológico, escalonadas.
 * La ventana total se mantiene acotada aunque el ramo tenga cien meses:
 * el desfase se comprime, no se alarga la espera.
 */
function awakenSchedule(pieces, opts = {}) {
  const count = pieces.length;
  const window = opts.window ?? 4;
  const maxStagger = opts.maxStagger ?? 0.24;
  const stagger = count > 1 ? Math.min(maxStagger, window / (count - 1)) : 0;
  const dur = opts.dur ?? 1.65;
  const map = new Map();
  [...pieces].sort((a, b) => a.m - b.m).forEach((p, i) => {
    map.set(p.m, { delay: i * stagger, dur });
  });
  return { map, stagger, dur, total: (count - 1) * stagger + dur };
}

/** Crecimiento mensual: una sola pieza, más lenta y con más presencia. */
function growthSchedule(pieces, m, opts = {}) {
  const dur = opts.dur ?? 2.8;
  const map = new Map();
  for (const p of pieces) map.set(p.m, p.m === m ? { delay: 0, dur } : null);
  return { map, dur, total: dur, only: m };
}

function progressFor(t, slot) {
  if (slot === undefined) return 1;
  if (slot === null) return 1;
  return clamp01((t - slot.delay) / slot.dur);
}

function tauFor(t, slot) {
  return easeInOut(progressFor(t, slot));
}

/**
 * Presentación de la flor nueva.
 * La corola acompaña la punta viva del tallo, se eleva un instante y termina
 * exactamente en su posición definitiva. El destello no usa filtros SVG para
 * mantener el movimiento fluido en Safari/iPhone.
 */
function presentationMotion(progress, opts = {}) {
  const p = clamp01(progress);
  const lift = opts.lift ?? 18;
  const glintPhase = clamp01((p - 0.48) / 0.52);
  return {
    liftY: -lift * Math.sin(Math.PI * p),
    scale: 0.72 + 0.28 * easeOut(p) + 0.08 * Math.sin(Math.PI * p),
    glint: Math.pow(Math.sin(Math.PI * glintPhase), 1.7),
    glintScale: 0.72 + 0.48 * glintPhase
  };
}

/** Despliegue de la envoltura; en el mes nuevo solo respira el lazo. */
function wrappingMotion(progress, monthly = false) {
  const p = clamp01(progress);
  if (monthly) {
    const pulse = Math.sin(Math.PI * p);
    return {
      paperOpacity: 1,
      paperScaleX: 1,
      paperScaleY: 1,
      paperY: 0,
      bowOpacity: 1,
      bowScale: 1 + 0.1 * pulse,
      bowRot: 2.5 * Math.sin(2 * Math.PI * p) * pulse,
      glow: 0.58 * pulse
    };
  }
  const paper = easeOut(clamp01((p - 0.08) / 0.5));
  const bow = easeOut(clamp01((p - 0.54) / 0.3));
  return {
    paperOpacity: paper,
    paperScaleX: 0.64 + 0.36 * paper,
    paperScaleY: 0.38 + 0.62 * paper,
    paperY: 18 * (1 - paper),
    bowOpacity: bow,
    bowScale: 0.42 + 0.58 * bow,
    bowRot: -8 * (1 - bow),
    glow: 0.5 * Math.pow(Math.sin(Math.PI * bow), 2)
  };
}

/** Respiración ambiental. Fases irracionalmente separadas: nunca se repite. */
function ambient(t, piece) {
  const s = Math.sin((2 * Math.PI * t) / piece.period + piece.phase);
  return { rot: 1.5 * s, scale: 1 + 0.012 * s };
}

/** Despliegue de la hoja: gira hacia su posición final y crece desde el tallo. */
function leafUnfold(tau) {
  return { rotOffset: -46 * (1 - tau), scale: 0.15 + 0.85 * tau };
}

/** Las ramitas y destellos entran al final, cuando el ramo ya está armado. */
function looseOpacity(t, total) {
  return clamp01((t - total * 0.55) / (total * 0.45));
}

/* official-state.js */
const ABS3_API_STORAGE = Object.freeze({
  url: 'abs3.api.url',
  lastMonths: 'abs3.api.lastMonths',
  seed: 'abs3.api.seed',
  officialDate: 'abs3.api.officialDate'
});

/** Acepta únicamente implementaciones HTTPS oficiales de Apps Script. */
function normalizeApiUrl(value) {
  const url = new URL(String(value || '').trim());
  const validPath = /^\/macros\/s\/[^/]+\/(exec|dev)$/.test(url.pathname);
  if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || !validPath) {
    throw new Error('Usa la URL HTTPS de Apps Script terminada en /exec.');
  }
  url.search = '';
  url.hash = '';
  return url.toString();
}

function validateOfficialState(payload) {
  if (!payload || payload.ok !== true) {
    const message = payload?.error?.message || 'La API no devolvió un estado válido.';
    throw new Error(message);
  }
  if (payload.timeZone !== 'America/Merida') {
    throw new Error('La API no está configurada en America/Merida.');
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(payload.officialDate || ''))) {
    throw new Error('La fecha oficial tiene un formato inválido.');
  }
  const unlockedMonths = Number(payload.unlockedMonths);
  if (!Number.isInteger(unlockedMonths) || unlockedMonths < 0) {
    throw new Error('El número de meses desbloqueados es inválido.');
  }
  const seed = String(payload.seed || '');
  if (!seed || seed.length > 128) throw new Error('La semilla oficial es inválida.');

  const newMonths = Array.isArray(payload.newMonths)
    ? payload.newMonths.filter((month) => Number.isInteger(month) && month > 0 && month <= unlockedMonths)
    : [];
  return Object.freeze({ ...payload, seed, unlockedMonths, newMonths });
}

async function fetchOfficialState(apiUrl, lastSeenMonths = 0, fetchImpl = fetch) {
  const url = normalizeApiUrl(apiUrl);
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), 15000) : null;
  try {
    const response = await fetchImpl(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'sync',
        lastSeenMonths: Math.max(0, Math.floor(Number(lastSeenMonths) || 0))
      }),
      redirect: 'follow',
      cache: 'no-store',
      signal: controller?.signal
    });
    if (!response.ok) throw new Error(`Apps Script respondió ${response.status}.`);
    return validateOfficialState(await response.json());
  } catch (error) {
    if (error?.name === 'AbortError') {
      throw new Error('Apps Script tardó demasiado en responder.');
    }
    throw error;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function loadApiSettings(storage = globalThis.localStorage) {
  try {
    const url = storage?.getItem(ABS3_API_STORAGE.url) || '';
    const rawMonths = storage?.getItem(ABS3_API_STORAGE.lastMonths);
    const lastMonths = rawMonths == null ? null : Math.max(0, Math.floor(Number(rawMonths) || 0));
    return {
      url,
      lastMonths,
      seed: storage?.getItem(ABS3_API_STORAGE.seed) || '',
      officialDate: storage?.getItem(ABS3_API_STORAGE.officialDate) || ''
    };
  } catch (error) {
    return { url: '', lastMonths: null, seed: '', officialDate: '' };
  }
}

function saveApiSettings(state, apiUrl, storage = globalThis.localStorage) {
  try {
    storage?.setItem(ABS3_API_STORAGE.url, normalizeApiUrl(apiUrl));
    storage?.setItem(ABS3_API_STORAGE.lastMonths, String(state.unlockedMonths));
    storage?.setItem(ABS3_API_STORAGE.seed, state.seed);
    storage?.setItem(ABS3_API_STORAGE.officialDate, state.officialDate);
    return true;
  } catch (error) {
    return false;
  }
}

/* ── Render ─────────────────────────────────────────────── */

function partToSVG(p) {
  const tf = [];
  if (p.tx || p.ty) tf.push(`translate(${p.tx || 0} ${p.ty || 0})`);
  if (p.rot) tf.push(`rotate(${p.rot})`);
  if (p.sc != null) tf.push(`scale(${p.sc})`);
  const t = tf.length ? ` transform="${tf.join(' ')}"` : '';
  const o = p.o != null ? ` opacity="${p.o}"` : '';
  const stroke = p.stroke
    ? ` stroke="${p.stroke}" stroke-width="${p.sw || 1}" stroke-linecap="round"`
    : '';
  if (p.t === 'circle') {
    return `<circle cx="${p.cx || 0}" cy="${p.cy || 0}" r="${p.r}" fill="${p.fill || 'none'}"${stroke}${o}${t}/>`;
  }
  if (p.stroke) {
    return `<path d="${p.d}" fill="${p.fill || 'none'}"${stroke}${o}${t}/>`;
  }
  return `<path d="${p.d}" fill="${p.fill}"${o}${t}/>`;
}

function flowerSVG(sp, pr, t, lod = 1) {
  return buildFlower(sp, pr, t, lod).map(partToSVG).join('');
}

function arrivalGlintSVG(pc) {
  const radius = Math.max(34, (pc.params.L || pc.params.R || 40) * 1.28);
  const inner = (radius * 0.68).toFixed(1);
  const outer = radius.toFixed(1);
  return `<circle r="${inner}" fill="none" stroke="hsl(48 100% 88%)" stroke-width="1.5"/>` +
    `<circle r="${outer}" fill="none" stroke="hsl(326 100% 88%)" stroke-width="1" stroke-dasharray="3 8"/>` +
    `<path d="M 0 ${-radius * 1.22} L 0 ${-radius * 0.74} M 0 ${radius * 0.74} L 0 ${radius * 1.22} ` +
    `M ${-radius * 1.22} 0 L ${-radius * 0.74} 0 M ${radius * 0.74} 0 L ${radius * 1.22} 0" ` +
    `fill="none" stroke="hsl(50 100% 94%)" stroke-width="2" stroke-linecap="round"/>`;
}

function curveLength(curve, steps = 36) {
  let total = 0;
  let previous = curve.at(0);
  for (let i = 1; i <= steps; i++) {
    const point = curve.at(i / steps);
    total += Math.hypot(point[0] - previous[0], point[1] - previous[1]);
    previous = point;
  }
  return total;
}

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const countNodes = () => stage.querySelectorAll('path,circle').length;

let scene = null;   // referencias vivas del modo ramo
let anim = null;    // { t0, sched }

function render() {
  if (mode === 'flor') {
    scene = null;
    stage.setAttribute('viewBox', '0 0 460 460');
    stage.innerHTML =
      `<rect width="460" height="460" fill="#000"/>` +
      `<g class="solo" transform="translate(230 250)">${flowerSVG(species, params, tau)}</g>`;
    out.innerHTML = formulaFor(species, params, tau)
      .map((l, i) => (i === 0 ? `<b>${esc(l)}</b>` : esc(l))).join('\n');
    noteEl.textContent = `${countNodes()} nodos SVG en esta flor.`;
    return;
  }
  renderBouquet();
}

function renderBouquet() {
  const seed = seedEl.value || 'x';
  const b = bouquetBounds(bouquet);
  const fol = foliageEl.checked
    ? buildFoliage(seed, bouquet, b.baseY, { spacing: BOUQUET_SPACING })
    : { back: [], front: [] };
  const wrap = wrappingEl.checked && bouquet.length
    ? buildWrapping(b)
    : { anchorX: 0, anchorY: b.tieY, back: [], front: [], bow: [], glow: [] };

  const byMonth = new Map();
  const loose = [];
  for (const part of [...fol.back, ...fol.front]) {
    if (part.m == null) { loose.push(part); continue; }
    if (!byMonth.has(part.m)) byMonth.set(part.m, []);
    byMonth.get(part.m).push(part);
  }

  stage.setAttribute('viewBox', `${b.x.toFixed(1)} ${b.y.toFixed(1)} ${b.w.toFixed(1)} ${b.h.toFixed(1)}`);
  const k = Math.max(1, b.w / 620);
  const OP = [0.55, 0.8, 1];

  let html = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#000"/>`;
  html += `<g id="wrap-back" transform="translate(${wrap.anchorX} ${wrap.anchorY})">${wrap.back.map(partToSVG).join('')}</g>`;
  html += `<g id="loose" opacity="0.5">${loose.map(partToSVG).join('')}</g>`;
  html += `<g id="pieces-layer">`;
  for (const pc of bouquet) {
    const st = stemFor(pc, b.baseY);
    const leaves = (byMonth.get(pc.m) || []).map(partToSVG).join('');
    html += `<g class="piece" data-m="${pc.m}" opacity="${OP[pc.pos.plane]}">` +
      `<path class="stem" d="${st.d}" fill="none" stroke="hsl(158 46% ${12 + pc.pos.plane * 6}%)" stroke-width="${((2.2 + pc.pos.plane * 0.7) * k).toFixed(2)}"/>` +
      `<g class="leaves">${leaves}</g>` +
      `<g class="head" transform="translate(${pc.pos.x} ${pc.pos.y}) scale(${pc.pos.scale}) rotate(${pc.tilt})">${flowerSVG(pc.species, pc.params, tau, pc.lod)}</g>` +
      `<g class="arrival-glint" opacity="0" aria-hidden="true" transform="translate(${pc.pos.x} ${pc.pos.y}) scale(${pc.pos.scale})">${arrivalGlintSVG(pc)}</g>` +
      `</g>`;
  }
  html += `</g>`;
  html += `<g id="wrap-front" transform="translate(${wrap.anchorX} ${wrap.anchorY})">${wrap.front.map(partToSVG).join('')}</g>`;
  html += `<g id="wrap-glow" opacity="0" transform="translate(${wrap.anchorX} ${wrap.anchorY})">${wrap.glow.map(partToSVG).join('')}</g>`;
  html += `<g id="wrap-bow" transform="translate(${wrap.anchorX} ${wrap.anchorY})">${wrap.bow.map(partToSVG).join('')}</g>`;
  html += `<g id="presentation-layer"></g>`;
  stage.innerHTML = html;

  scene = {
    bounds: b,
    loose: stage.querySelector('#loose'),
    piecesLayer: stage.querySelector('#pieces-layer'),
    presentationLayer: stage.querySelector('#presentation-layer'),
    wrapping: {
      anchorX: wrap.anchorX,
      anchorY: wrap.anchorY,
      back: stage.querySelector('#wrap-back'),
      front: stage.querySelector('#wrap-front'),
      bow: stage.querySelector('#wrap-bow'),
      glow: stage.querySelector('#wrap-glow')
    },
    items: []
  };
  for (const g of stage.querySelectorAll('.piece')) {
    const m = Number(g.dataset.m);
    const pc = bouquet.find((x) => x.m === m);
    const stem = g.querySelector('.stem');
    const stemGeom = stemFor(pc, b.baseY);
    const len = curveLength(stemGeom);
    stem.setAttribute('stroke-dasharray', len.toFixed(1));
    const leafEls = [...g.querySelectorAll('.leaves > *')].map((el, idx) => ({
      el,
      tx: (byMonth.get(m) || [])[idx]?.tx ?? 0,
      ty: (byMonth.get(m) || [])[idx]?.ty ?? 0,
      rot: (byMonth.get(m) || [])[idx]?.rot ?? 0
    }));
    scene.items.push({
      pc, group: g, stem, stemGeom, len, leaves: leafEls,
      head: g.querySelector('.head'), glint: g.querySelector('.arrival-glint'),
      lastTau: tau, nextGen: 0
    });
  }

  const last = bouquet[bouquet.length - 1];
  const orden = bouquet.map(p => p.species[0].toUpperCase());
  out.innerHTML =
    `<b>mes ${months} · ${last ? last.species : '—'}</b>\n` +
    `ρₘ = c·√m = ${last ? last.pos.rho.toFixed(1) : 0}   (c = ${BOUQUET_SPACING}, sin capacidad máxima)\n` +
    `θₘ = m·ψ = ${last ? ((last.m * PSI * 180 / Math.PI) % 360).toFixed(2) : 0}°\n` +
    `hoja:  x(u) = w·sin(π·u^0.7)(1 − 0.12u) + κ·L·u²\n` +
    `tallo: dashoffset = (1 − τ)·longitud\n` +
    `hoja:  rot = rot₁ − 46°(1 − τ),  escala = 0.15 + 0.85τ\n` +
    `orden: ${orden.slice(0, 48).join(' ')}${orden.length > 48 ? ' …' : ''}`;
  noteEl.textContent = `${countNodes()} nodos SVG en el ramo.`;
  applyFrame(performance.now() / 1000);
}

/* ── Animación ──────────────────────────────────────────── */

function applyFrame(now) {
  if (mode === 'flor') {
    if (!breatheEl.checked) return;
    const g = stage.querySelector('.solo');
    if (!g) return;
    const s = Math.sin((2 * Math.PI * now) / 7);
    g.setAttribute('transform',
      `translate(230 250) rotate(${(1.5 * s).toFixed(3)}) scale(${(1 + 0.012 * s).toFixed(4)})`);
    return;
  }
  if (!scene) return;

  const at = anim ? now - anim.t0 : Infinity;
  if (anim) {
    const overall = clamp01(at / Math.max(anim.sched.total, 0.001));
    const label = anim.sched.only != null
      ? `Presentando flor del mes ${anim.sched.only}`
      : 'Despertando el ramo desde las puntas';
    setMotionStatus(label, overall, true);
  }
  if (anim && at > anim.sched.total + 0.3) {
    const finished = anim;
    anim = null;
    // Durante la presentación, la flor mensual vive al frente. Al terminar,
    // todas las piezas recuperan el orden estable de planos del ramo.
    if (finished.sched.only != null) {
      for (const item of scene.items) scene.piecesLayer.append(item.group);
    }
    setMotionStatus(
      finished.sched.only != null ? `Flor del mes ${finished.sched.only} agregada` : 'Ramo despierto',
      1,
      false
    );
    if (finished.resolve) finished.resolve(true);
  }

  const wrapOverall = anim ? clamp01(at / Math.max(anim.sched.total, 0.001)) : 1;
  const wrapState = wrappingMotion(wrapOverall, Boolean(anim?.sched.only != null));
  const paperTransform =
    `translate(${scene.wrapping.anchorX} ${(scene.wrapping.anchorY + wrapState.paperY).toFixed(2)}) ` +
    `scale(${wrapState.paperScaleX.toFixed(4)} ${wrapState.paperScaleY.toFixed(4)})`;
  scene.wrapping.back.setAttribute('opacity', wrapState.paperOpacity.toFixed(3));
  scene.wrapping.front.setAttribute('opacity', wrapState.paperOpacity.toFixed(3));
  scene.wrapping.back.setAttribute('transform', paperTransform);
  scene.wrapping.front.setAttribute('transform', paperTransform);
  const bowTransform =
    `translate(${scene.wrapping.anchorX} ${scene.wrapping.anchorY}) ` +
    `rotate(${wrapState.bowRot.toFixed(3)}) scale(${wrapState.bowScale.toFixed(4)})`;
  scene.wrapping.bow.setAttribute('opacity', wrapState.bowOpacity.toFixed(3));
  scene.wrapping.bow.setAttribute('transform', bowTransform);
  scene.wrapping.glow.setAttribute('opacity', wrapState.glow.toFixed(3));
  scene.wrapping.glow.setAttribute('transform',
    `translate(${scene.wrapping.anchorX} ${scene.wrapping.anchorY}) scale(${(1 + wrapState.glow * 0.35).toFixed(4)})`);

  for (const it of scene.items) {
    const slot = anim ? anim.sched.map.get(it.pc.m) : undefined;
    const t = anim ? tauFor(at, slot) * tau : tau;
    const progress = anim ? tauFor(at, slot) : 1;
    const presenting = Boolean(anim && anim.sched.only === it.pc.m);
    const arrival = presenting ? presentationMotion(progress) : {
      liftY: 0, scale: 1, glint: 0, glintScale: 1
    };
    const tip = anim && slot ? it.stemGeom.at(progress) : [it.pc.pos.x, it.pc.pos.y];

    it.stem.setAttribute('stroke-dashoffset', ((1 - progress) * it.len).toFixed(1));

    const uf = leafUnfold(progress);
    for (const lf of it.leaves) {
      lf.el.setAttribute('transform',
        `translate(${lf.tx} ${lf.ty}) rotate(${(lf.rot + uf.rotOffset).toFixed(2)}) scale(${uf.scale.toFixed(3)})`);
    }

    // La geometría solo se regenera mientras la flor está abriéndose,
    // y como mucho cada 40 ms. Ya abierta, no se toca.
    if (Math.abs(t - it.lastTau) > 0.012 && now >= it.nextGen) {
      it.head.innerHTML = flowerSVG(it.pc.species, it.pc.params, t, it.pc.lod);
      it.lastTau = t;
      it.nextGen = now + 0.04;
    }

    const amb = breatheEl.checked ? ambient(now, it.pc) : { rot: 0, scale: 1 };
    const headX = tip[0];
    const headY = tip[1] + arrival.liftY;
    it.head.setAttribute('transform',
      `translate(${headX.toFixed(2)} ${headY.toFixed(2)}) ` +
      `scale(${(it.pc.pos.scale * amb.scale * arrival.scale).toFixed(4)}) ` +
      `rotate(${(it.pc.tilt + amb.rot).toFixed(3)})`);
    it.glint.setAttribute('opacity', arrival.glint.toFixed(3));
    it.glint.setAttribute('transform',
      `translate(${headX.toFixed(2)} ${headY.toFixed(2)}) ` +
      `scale(${(it.pc.pos.scale * arrival.glintScale).toFixed(4)})`);
  }

  if (scene.loose) {
    scene.loose.setAttribute('opacity',
      (0.5 * (anim ? looseOpacity(at, anim.sched.total) : 1)).toFixed(3));
  }
}

let raf = null;
function loop(now) {
  // El callback actual ya se consumió. Reiniciar primero evita que una
  // excepción deje un identificador viejo y congele los botones para siempre.
  raf = null;
  try {
    applyFrame(now / 1000);
  } catch (error) {
    console.error('abs<3 · error de animación', error);
    const failed = anim;
    anim = null;
    if (failed?.resolve) failed.resolve(false);
    breatheEl.checked = false;
    setMotionStatus('No se pudo animar; recarga ABRIR.html', 0, false);
  }
  if (anim || breatheEl.checked) startLoop();
}
function startLoop() { if (raf == null) raf = requestAnimationFrame(loop); }
function stopLoop() { if (raf != null) { cancelAnimationFrame(raf); raf = null; } }

function cancelActiveAnimation() {
  if (anim?.resolve) anim.resolve(false);
  anim = null;
}

function enterBouquetMode() {
  if (mode !== 'ramo') {
    mode = 'ramo';
    syncModeButtons();
  }
}

function showBouquetState(targetMonths, targetSeed = seedEl.value || 'x') {
  cancelActiveAnimation();
  enterBouquetMode();
  seedEl.value = targetSeed;
  months = Math.max(0, Math.floor(Number(targetMonths) || 0));
  rebuildBouquet();
  buildSliders();
  render();
}

function playAwakening() {
  enterBouquetMode();
  if (!bouquet.length) {
    setMotionStatus('Aún no hay flores desbloqueadas', 1, false);
    return Promise.resolve(true);
  }
  cancelActiveAnimation();
  const promise = new Promise((resolve) => {
    anim = { t0: performance.now() / 1000, sched: awakenSchedule(bouquet), resolve };
  });
  setMotionStatus('Despertando el ramo desde las puntas', 0, true);
  applyFrame(anim.t0);
  startLoop();
  return promise;
}

function playMonthlyArrival(targetMonth) {
  cancelActiveAnimation();
  enterBouquetMode();
  months = Math.max(1, Math.floor(Number(targetMonth) || 1));
  rebuildBouquet();
  buildSliders();
  render();
  const promise = new Promise((resolve) => {
    anim = {
      t0: performance.now() / 1000,
      sched: growthSchedule(bouquet, months),
      resolve
    };
  });
  setMotionStatus(`Presentando flor del mes ${months}`, 0, true);
  const newest = scene?.items.find((it) => it.pc.m === months);
  if (newest) scene.presentationLayer.append(newest.group);
  applyFrame(anim.t0);
  startLoop();
  return promise;
}

breatheEl.addEventListener('change', () => {
  if (breatheEl.checked || anim) startLoop();
  else { stopLoop(); render(); }
});

document.getElementById('awaken').addEventListener('click', () => {
  if (mode !== 'ramo') showBouquetState(months);
  playAwakening();
});

document.getElementById('grow').addEventListener('click', () => {
  markLocalPreview();
  playMonthlyArrival(months + 1);
});

async function applyOfficialState(state, previousOfficialMonths) {
  const target = state.unlockedMonths;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasPrevious = Number.isInteger(previousOfficialMonths) && previousOfficialMonths >= 0;
  const delta = hasPrevious ? target - previousOfficialMonths : null;

  if (reducedMotion || target === 0 || !hasPrevious || delta <= 0 || delta > 3) {
    showBouquetState(target, state.seed);
    if (!reducedMotion && target > 0 && (!hasPrevious || delta > 3)) {
      await playAwakening();
    } else {
      setMotionStatus(
        target > 0 ? `Estado oficial: mes ${target}` : 'Aún no hay flores desbloqueadas',
        1,
        false
      );
    }
    return;
  }

  // En el caso normal llega un solo mes. Si hubo una ausencia corta, presenta
  // hasta tres flores pendientes una por una y conserva el destello de cada una.
  showBouquetState(previousOfficialMonths, state.seed);
  for (let month = previousOfficialMonths + 1; month <= target; month += 1) {
    const completed = await playMonthlyArrival(month);
    if (!completed) return;
  }
}

async function synchronizeOfficialState() {
  const rawUrl = apiUrlEl.value.trim();
  syncOfficialEl.disabled = true;
  setApiStatus('Consultando fecha oficial…', 'El teléfono no decide el mes.', 'loading');
  try {
    const canonicalUrl = normalizeApiUrl(rawUrl);
    const cached = loadApiSettings();
    const sameDeployment = cached.url === canonicalUrl;
    const lastSeenMonths = sameDeployment && cached.lastMonths != null ? cached.lastMonths : 0;
    const state = await fetchOfficialState(canonicalUrl, lastSeenMonths);
    const previous = sameDeployment && cached.seed === state.seed ? cached.lastMonths : null;

    apiUrlEl.value = canonicalUrl;
    saveApiSettings(state, canonicalUrl);
    await applyOfficialState(state, previous);
    const committed = state.newlyCommittedMonths?.length
      ? ` · ${state.newlyCommittedMonths.length} pendiente(s) confirmada(s)`
      : '';
    setApiStatus(
      `Conectado · mes oficial ${state.unlockedMonths}`,
      `${state.officialDate} en Mérida · próximo: ${state.nextUnlockDate}${committed}`,
      'online'
    );
  } catch (error) {
    console.error('abs<3 · error de sincronización', error);
    setApiStatus(
      'No se pudo sincronizar',
      error?.message || 'Revisa la URL /exec y la implementación.',
      'error'
    );
  } finally {
    syncOfficialEl.disabled = false;
  }
}

/* ── Controles ──────────────────────────────────────────── */

function syncModeButtons() {
  for (const x of document.getElementById('modes').children) {
    x.setAttribute('aria-pressed', String(x.dataset.mode === mode));
  }
  document.getElementById('species').style.display = mode === 'ramo' ? 'none' : 'flex';
}

document.getElementById('modes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  syncModeButtons();
  if (mode === 'ramo') rebuildBouquet();
  buildSliders(); render();
});

document.getElementById('species').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  species = b.dataset.sp;
  for (const x of e.currentTarget.children) x.setAttribute('aria-pressed', String(x === b));
  reseedFlower(); render();
});

seedEl.addEventListener('input', () => {
  if (mode === 'ramo') markLocalPreview();
  if (mode === 'ramo') rebuildBouquet(); else reseedFlower();
  render();
});

foliageEl.addEventListener('change', render);
wrappingEl.addEventListener('change', render);
syncOfficialEl.addEventListener('click', synchronizeOfficialState);

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  breatheEl.checked = true;
  startLoop();
}

reseedFlower();
rebuildBouquet();
render();

const savedApi = loadApiSettings();
const startupApiUrl = savedApi.url || DEFAULT_API_URL;
if (startupApiUrl) {
  apiUrlEl.value = startupApiUrl;
  if (savedApi.lastMonths != null && savedApi.seed) {
    showBouquetState(savedApi.lastMonths, savedApi.seed);
    setMotionStatus(`Último estado oficial: mes ${savedApi.lastMonths}`, 1, false);
  }
  setApiStatus(
    'API configurada · sincronización pendiente',
    savedApi.officialDate
      ? `Última fecha oficial recibida: ${savedApi.officialDate}`
      : 'Conectando automáticamente con el deployment @2…',
    'loading'
  );
  setTimeout(synchronizeOfficialState, 0);
}
</script>
